name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DeepSeekTray.slnx

      - name: Build
        run: dotnet build DeepSeekTray.slnx -c Release --no-restore

      - name: Self-test
        shell: pwsh
        run: |
          $exe = "src/DeepSeekTray.Avalonia/bin/Release/net10.0-windows/DeepSeekTray.exe"
          if (-not (Test-Path $exe)) { throw "Build output not found: $exe" }

          $process = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:TEMP/deepseek-tray-selftest.log" -ErrorAction SilentlyContinue

          if ($process.ExitCode -ne 0) {
            throw "Self-test failed with exit code $($process.ExitCode)"
          }
